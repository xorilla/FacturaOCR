server {
    listen 80;
    listen [::]:80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # Headers de seguretat. La CSP permet el model de Hugging Face i
    # ONNX Runtime de jsDelivr, que és on runonweb carrega els binaris.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; connect-src 'self' https://huggingface.co https://*.huggingface.co https://*.hf.co https://cdn.jsdelivr.net; script-src 'self' 'wasm-unsafe-eval' blob: https://cdn.jsdelivr.net; worker-src 'self' blob:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'; font-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'" always;

    # Healthcheck per a Docker i Dokploy.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # L'HTML no s'ha de cachejar: ha d'apuntar sempre als assets nous.
    location = /index.html {
        expires -1;
    }

    # Els assets de Vite porten hash al nom; es poden cachejar fort.
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # Els workers de pdf.js són .mjs; força el MIME correcte.
    location ~* \.mjs$ {
        types {
            application/javascript mjs;
        }
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # SPA: qualsevol ruta desconeguda torna a index.html.
    location / {
        try_files $uri $uri/ /index.html;
        expires -1;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/javascript
        application/json
        application/xml
        image/svg+xml
        application/wasm;
}
